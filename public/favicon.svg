<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="#2196F3" />
  
  <!-- 帆船主体 -->
  <polygon points="50,20 30,70 70,70" fill="#FFFFFF" /> <!-- 主帆 -->
  <polygon points="50,30 40,70 60,70" fill="#E3F2FD" /> <!-- 主帆阴影 -->
  <polygon points="50,40 35,70 65,70" fill="#F5F5F5" /> <!-- 主帆高光 -->
  
  <!-- 船体 -->
  <rect x="30" y="75" width="40" height="5" fill="#8D6E63" />
  <rect x="35" y="80" width="30" height="3" fill="#6D4C41" />
  
  <!-- 桅杆 -->
  <rect x="49" y="20" width="2" height="55" fill="#8D6E63" />
  
  <!-- 波浪效果 -->
  <path d="M10 85 Q25 80 40 85 T70 85 T100 85" stroke="#1976D2" stroke-width="2" fill="none" />
  <path d="M15 88 Q30 83 45 88 T75 88 T95 88" stroke="#1976D2" stroke-width="2" fill="none" />
